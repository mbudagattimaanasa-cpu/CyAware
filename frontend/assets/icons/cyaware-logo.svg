        stroke="url(#shield_grad)" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Circuit Traces -->
  <path d="M16 20H20V26" stroke="#00d2ff" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="16" cy="20" r="1.5" fill="#00d2ff"/>
  
  <path d="M32 20H28V26" stroke="#00d2ff" stroke-width="1.75" stroke-linecap="round"/>
