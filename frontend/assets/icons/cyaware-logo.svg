<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Shield Outer Glow -->
  <path d="M24 4L7 11V22C7 32.5 14.3 42.2 24 44.8C33.7 42.2 41 32.5 41 22V11L24 4Z" 
        fill="url(#shield_glow)" fill-opacity="0.2"/>
  
