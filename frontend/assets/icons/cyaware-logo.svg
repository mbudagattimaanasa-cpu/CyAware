  <circle cx="24" cy="26" r="6" stroke="#00d2ff" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="shield_grad" x1="7" y1="4" x2="41" y2="44.8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d2ff"/>
      <stop offset="0.6" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="shield_glow" cx="24" cy="24" r="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d2ff" stop-opacity="0.4"/>
